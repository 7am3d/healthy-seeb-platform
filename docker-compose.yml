services:
  postgres:
    image: postgres:17-alpine
    container_name: healthy-seeb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: healthy_seeb_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - healthy_seeb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthy_seeb_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthy_seeb_postgres_data:

